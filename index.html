<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA SOLO LEVELING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0c; color: #eee; font-family: 'sans-serif'; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .neon-border { border: 1px solid #00d4ff; box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
        .card { background: rgba(20, 20, 25, 0.9); border: 1px solid #333; transition: 0.2s; }
        .card:active { transform: scale(0.98); border-color: #00d4ff; }
        .progress-bar { height: 8px; background: #111; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #0066ff, #00d4ff); width: 89%; transition: 1s; }
        #penalty { display: none; position: fixed; inset: 0; background: rgba(20,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; border: 5px solid red; }
    </style>
</head>
<body class="p-4">

    <div id="penalty">
        <h1 class="font-game text-4xl text-red-600 mb-4 text-center">MISSÃO FALHADA</h1>
        <p class="mb-8 text-white">PENALIDADE: 100 BURPEES</p>
        <button onclick="document.getElementById('penalty').style.display='none'" class="border border-red-600 p-4 text-red-600 uppercase font-game">Aceitar Castigo</button>
    </div>

    <div class="max-w-md mx-auto">
        <div class="neon-border p-5 rounded mb-6">
            <div class="flex justify-between mb-4">
                <div>
                    <h1 class="font-game text-2xl text-cyan-400 italic">WENDRICK</h1>
                    <span class="text-xs bg-cyan-900 px-2 py-1 rounded">RANK C-</span>
                </div>
                <div class="text-right">
                    <p class="font-game text-sm">LVL 03</p>
                </div>
            </div>
            
            <div class="text-xs mb-1 flex justify-between uppercase">
                <span>Progresso de Peso</span>
                <span class="text-cyan-400">58kg / 65kg</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <h2 class="font-game text-xs mb-3 text-gray-500 tracking-widest">INVENTÁRIO</h2>
        <div class="grid grid-cols-3 gap-2 mb-8">
            <button onclick="alert('Item Consumido: +1 FOR')" class="card p-3 rounded text-center">
                <div class="text-xl">🍗</div>
                <p class="text-[10px] mt-1 uppercase text-blue-400">Proteína</p>
            </button>
            <button onclick="alert('Item Consumido: +1 VIT')" class="card p-3 rounded text-center">
                <div class="text-xl">🍚</div>
                <p class="text-[10px] mt-1 uppercase text-green-400">Carbo</p>
            </button>
            <button onclick="alert('Item Consumido: +2 VIT')" class="card p-3 rounded text-center border-yellow-700/50">
                <div class="text-xl">🧪</div>
                <p class="text-[10px] mt-1 uppercase text-yellow-500">Elixir</p>
            </button>
        </div>

        <h2 class="font-game text-xs mb-3 text-gray-500 tracking-widest uppercase text-white">Missão do Dia</h2>
        
        <div id="restBox" class="hidden card p-4 mb-4 border-cyan-500 text-center animate-pulse">
            <p class="text-[10px] text-cyan-400 mb-1">REGENERAÇÃO...</p>
            <h2 id="timer" class="text-4xl font-game">60s</h2>
        </div>

        <div class="space-y-2">
            <div onclick="startTimer(60)" class="card p-4 rounded flex justify-between items-center cursor-pointer hover:bg-zinc-800">
                <div>
                    <p class="font-bold">Flexão Declinada</p>
                    <p class="text-[10px] text-gray-500 uppercase">4 Séries até a falha</p>
                </div>
                <span class="text-cyan-500 font-game text-xs">GO</span>
            </div>

            <div onclick="startTimer(60)" class="card p-4 rounded flex justify-between items-center cursor-pointer hover:bg-zinc-800">
                <div>
                    <p class="font-bold">Remada Invertida</p>
                    <p class="text-[10px] text-gray-500 uppercase">3 Séries com pausa</p>
                </div>
                <span class="text-cyan-500 font-game text-xs">GO</span>
            </div>
        </div>

        <div class="mt-10 grid grid-cols-2 gap-2">
            <button onclick="document.getElementById('penalty').style.display='flex'" class="p-3 border border-red-900 text-red-900 text-xs uppercase font-game">Desistir</button>
            <button onclick="location.reload()" class="p-3 border border-zinc-700 text-zinc-500 text-xs uppercase font-game">Refresh</button>
        </div>
    </div>

    <script>
        function startTimer(sec) {
            const box = document.getElementById('restBox');
            const display = document.getElementById('timer');
            box.style.display = 'block';
            let t = sec;
            
            const count = setInterval(() => {
                display.innerText = t + 's';
                if(t <= 0) {
                    clearInterval(count);
                    display.innerText = 'LUTE!';
                    setTimeout(() => box.style.display = 'none', 2000);
                }
                t--;
            }, 1000);
        }
    </script>
</body>
</html>
